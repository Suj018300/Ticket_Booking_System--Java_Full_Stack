services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    restart: always
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - kcdata:/opt/keycloak/data
      - ./keycloak-import:/opt/keycloak/data/import

  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    restart: always
    depends_on: [db, keycloak]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${DOMAIN}/auth/realms/event-ticket-platform

  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    restart: always
    depends_on: [db, keycloak]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${DOMAIN}/auth/realms/event-ticket-platform

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: always
    depends_on: [backend, keycloak]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes: [caddydata:/data]

volumes: { pgdata: {}, kcdata: {}, caddydata: {} }
